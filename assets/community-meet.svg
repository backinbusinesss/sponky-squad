    <circle cx="430" cy="468" r="18"/>
    <path d="M446 512L470 546C474 551 472 558 467 560C462 562 457 560 455 555L437 524Z"/>
    <path d="M414 512L394 544C391 549 393 556 398 558C403 560 408 558 410 553L425 528Z"/>
  </g>

  <!-- bozzoli luce residui -->
  <g filter="url(#mpBlur4)" opacity=".6">
    <rect x="20" y="470" width="8" height="430" fill="#FF7A18" opacity=".4"/>
    <rect x="692" y="470" width="8" height="430" fill="#19E6FF" opacity=".35"/>
