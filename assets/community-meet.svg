  <g fill="#05060A">
    <path d="M300 470C314 470 324 482 324 498L322 566C334 570 342 578 342 590L338 660C336 668 330 672 322 672C314 672 308 666 308 658L312 604L306 604L302 658C300 666 294 672 286 672C278 672 272 666 272 658L268 590C268 578 276 570 288 566L286 498C286 482 296 470 300 470Z"/>
    <circle cx="300" cy="452" r="20"/>
    <path d="M318 500L346 540C350 546 348 554 342 556C336 558 330 556 328 550L306 512Z"/>
    <path d="M282 500L258 538C254 544 256 552 262 554C268 556 274 554 276 548L294 514Z"/>
  </g>
  <g fill="#05060A">
