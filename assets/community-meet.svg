    <g>
      <path d="M336 150H384L394 184H326Z" fill="#171A24"/>
      <ellipse cx="360" cy="186" rx="34" ry="10" fill="#FFE7C4"/>
      <path d="M300 186H420L500 470H220Z" fill="url(#mpLamp)"/>
