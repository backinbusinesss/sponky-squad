    <circle cx="-64" cy="104" r="42" fill="#08080B"/>
    <circle cx="66" cy="104" r="42" fill="#08080B"/>
    <path d="M-74 74C-70 30 -44 6 -8 6L10 0C46 -8 78 8 86 46L88 76C74 90 54 92 34 86L0 74C-28 64 -58 70 -72 88Z" fill="#0D0F16"/>
