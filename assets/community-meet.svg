    <rect x="-46" y="34" width="96" height="30" rx="15" fill="#FF2F2F" opacity=".5" filter="url(#mpBlur10)"/>
    <path d="M-10 100C6 106 24 106 40 100" stroke="#2A2D38" stroke-width="12" stroke-linecap="round"/>
