        x="360"
        y="202"
        text-anchor="middle"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="42"
        font-weight="900"
        letter-spacing="6"
        fill="#FF7A18"
      >SPONKY</text>
    </g>
    <text
      x="360"
      y="202"
      text-anchor="middle"
      font-family="Arial Black, Arial, Helvetica, sans-serif"
      font-size="42"
      font-weight="900"
      letter-spacing="6"
      fill="#FFB877"
