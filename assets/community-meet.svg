    <circle cx="-70" cy="106" r="46" fill="#08080B"/>
    <circle cx="-70" cy="106" r="24" fill="none" stroke="#31343E" stroke-width="7"/>
    <circle cx="74" cy="106" r="46" fill="#08080B"/>
    <circle cx="74" cy="106" r="24" fill="none" stroke="#31343E" stroke-width="7"/>
    <path d="M-92 66C-86 24 -54 4 -16 4L26 -8C64 -18 98 0 110 40L114 72C98 88 76 92 52 84L8 68C-22 56 -62 66 -84 86Z" fill="#10121A"/>
