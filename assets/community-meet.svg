<svg width="720" height="900" viewBox="0 0 720 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mpBg" x1="360" y1="0" x2="360" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0B12"/>
      <stop offset=".55" stop-color="#12141D"/>
      <stop offset="1" stop-color="#0B0C12"/>
    </linearGradient>
    <linearGradient id="mpWall" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1A1D28"/>
      <stop offset="1" stop-color="#0D0F16"/>
    </linearGradient>
    <radialGradient id="mpLamp" cx=".5" cy="0" r="1">
      <stop stop-color="#FFE7C4" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#FFB067" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mpNeonPool">
      <stop stop-color="#19E6FF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#19E6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mpOrangePool">
      <stop stop-color="#FF7A18" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mpVignette">
      <stop offset=".52" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".74"/>
    </radialGradient>
    <filter id="mpBlur24" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="mpBlur10" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="mpBlur4" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="720" height="900" fill="url(#mpBg)"/>

  <!-- parete garage / locale -->
  <path d="M0 0H720V470H0Z" fill="url(#mpWall)"/>
  <g stroke="#FFFFFF" stroke-opacity=".05">
    <path d="M0 96H720M0 192H720M0 288H720M0 384H720"/>
    <path d="M120 0V470M300 0V470M480 0V470M640 0V470"/>
  </g>
  <!-- travi -->
  <rect x="0" y="70" width="720" height="14" fill="#0A0B12" opacity=".9"/>
  <rect x="0" y="84" width="720" height="4" fill="#FF7A18" opacity=".35"/>

  <!-- insegna al neon SPONKY -->
  <g>
    <rect x="150" y="130" width="420" height="112" rx="16" fill="#0A0B12" stroke="#FFFFFF" stroke-opacity=".1"/>
    <g filter="url(#mpBlur10)" opacity=".95">
      <rect x="180" y="158" width="360" height="56" rx="10" fill="none" stroke="#19E6FF" stroke-width="5"/>
    </g>
    <rect x="180" y="158" width="360" height="56" rx="10" fill="none" stroke="#19E6FF" stroke-width="3"/>
    <g filter="url(#mpBlur10)">
