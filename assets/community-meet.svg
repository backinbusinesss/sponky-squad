  </g>

  <!-- lampade sospese -->
  <g>
    <path d="M120 84V176M360 84V150M600 84V186" stroke="#0A0B12" stroke-width="5"/>
    <g>
      <path d="M96 176H144L154 210H86Z" fill="#171A24"/>
      <ellipse cx="120" cy="212" rx="34" ry="10" fill="#FFE7C4"/>
      <path d="M60 212H180L260 470H-20Z" fill="url(#mpLamp)"/>
